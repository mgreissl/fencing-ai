# =============================================================================
# Fencing AI — Modern Pipeline Configuration
# =============================================================================
# Override any value from CLI:  python -m src.train training.lr=5e-4

# --- Data -------------------------------------------------------------------
data:
  # Target weapon mode: 'foil' | 'sabre' | 'epee' | 'multi'
  weapon: "${oc.env:FENCING_WEAPON,foil}"
  # Weapons left out when weapon is 'multi'/'all' (epee has no right of way,
  # its label follows from the lights; ignored for a single-weapon run)
  exclude_weapons: [epee]
  # Directory with .mp4 clips (labels L/R/T); null = data/clips/{weapon}
  clips_dir: "${oc.env:FENCING_CLIPS_DIR,null}"
  # Legacy static flipped directory (false by default: on-the-fly dynamic flip is used)
  include_flipped: false
  flipped_dir: "${oc.env:FENCING_FLIPPED_DIR,more_training_data}"

  # Blank the scoreboard/overlay band before resize and flip (shortcut removal).
  # Rows from y_min_frac * height to the bottom are set to the ImageNet mean;
  # null derives it from configs/overlay/fie_default.yaml (295 / 360 = 0.82).
  overlay_mask:
    enabled: true
    y_min_frac: null

  # Number of frames to sample per clip (must match model expectation)
  num_frames: 16
  # Spatial resolution fed to the model
  frame_size: 224

  # Train / val / test split ratios
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

  # Random seed for reproducible splits (also seeds the max_clips subset)
  split_seed: 42

  # Split grouping: clips of one 'match' (or 'tournament') never span splits
  group_by: "match"
  # Use the `split` column of the manifest if every row has one
  use_manifest_split: false
  # Grouped k-fold CV: cv_folds=0 disables; otherwise fold `cv_fold` is test,
  # fold cv_fold+1 is val, the rest train (ratios above are ignored)
  cv_folds: 0
  cv_fold: 0

  # Clip validation at dataset build: 'exists' = file present (and one open to
  # count frames when the manifest has no n_frames); 'full' = additionally open
  # every clip and decode its first frame (finds corrupt files before training)
  validate_clips: "exists"

  # Max clips to load (null = all): label-stratified random subset (seeded)
  max_clips: null

  # DataLoader workers (0 = main process; safe default for macOS)
  num_workers: 0
  pin_memory: false

  # Temporal sampling strategy:
  #   'onset_window': evenly spaced frames in [onset - window_pre_s, onset + window_post_s]
  #                   (needs light_frame_in_clip + clip_fps in the manifest, else uniform)
  #   'end_weighted': denser sampling in the second half of the clip
  #   'uniform':      evenly spaced over the whole clip
  sampling_mode: "onset_window"
  window_pre_s: 1.0
  window_post_s: 0.25

# --- Model -------------------------------------------------------------------
model:
  # HuggingFace model identifier
  backbone: "MCG-NJU/videomae-base-finetuned-kinetics"

  # Video stream on/off. false = kinematics-only (no backbone is loaded;
  # requires use_kinematics: true). See configs/experiment/ for ablations.
  use_video: true

  # Explicit VideoMAEConfig kwargs (e.g. hidden_size, num_hidden_layers,
  # image_size, patch_size, tubelet_size, num_frames). When set, a randomly
  # initialised backbone is built from it instead of loading `backbone`
  # (no download; for smoke tests).
  backbone_config: null

  # false: raise when the token count does not fit the VideoMAE grid; true:
  # degrade to global pooling with a zero left-right difference (warning)
  allow_pool_fallback: false

  # Freeze the backbone base
  freeze_backbone: true

  # LoRA fine-tuning on top spatio-temporal attention blocks
  use_lora: true
  lora:
    r: 8
    alpha: 16
    # Dropout inside the LoRA adapters (independent of the head dropout)
    dropout: 0.1
    layers:
      - 8
      - 9
      - 10
      - 11

  # Kinematics & Sword-Arm Velocity Stream
  use_kinematics: true
  kinematics:
    feature_dim: 21
    hidden_dim: 128
    # Directory of cached full-rate features (see scripts/precompute_kinematics.py)
    cache_dir: "data/kinematics"
    # Optional overrides of DEFAULT_KINEMATICS_SETTINGS (null = defaults)
    settings: null
    # false: a missing cache entry raises; true: compute pose features on the fly
    compute_if_missing: false

  # Classification head config
  head:
    hidden_dim: 256
    dropout: 0.3
    num_classes: 3

  # Class names (order matters — must match label encoding)
  class_names:
    - "Left"
    - "Tie"
    - "Right"

# --- Training ----------------------------------------------------------------
training:
  # Seeds python, numpy, torch, DataLoader shuffling and workers
  seed: 42
  # Metric for checkpoint selection / early stopping:
  #   on_on_macro_f1 | macro_f1 | accuracy
  # on_on_macro_f1 = macro-F1 on the clips the lights do not decide (On-On and
  # foil On-Off/Off-On), so trivial single-light clips do not dominate the
  # selection; falls back to macro_f1 (warning) if the val split has none.
  selection_metric: "on_on_macro_f1"

  batch_size: 4
  epochs: 20
  lr: 1.5e-4
  weight_decay: 1.0e-4

  # Learning rate scheduler
  scheduler:
    type: "cosine"        # cosine | step | none
    warmup_epochs: 3
    min_lr: 1.0e-6

  # Mixed precision (float16) — reduces memory, may speed up on MPS
  mixed_precision: true

  # Gradient clipping max norm
  grad_clip_norm: 1.0

  # Early stopping (patience in epochs; 0 = disabled)
  early_stopping_patience: 6

  # Save best model checkpoint
  checkpoint_dir: "checkpoints"

  # Device preference: auto | mps | cuda | cpu
  device: "auto"

# --- Evaluation --------------------------------------------------------------
eval:
  # Split of the checkpoint's saved split file to evaluate
  split: "test"
  # Output directory for predictions/metrics (null = checkpoint_dir)
  output_dir: null
  # Flip test-time averaging: mean of f(x) and L/R-swapped f(flip(x)); applied
  # in validation and evaluation (2x forward passes)
  flip_tta: true
  # Bins for expected calibration error
  ece_bins: 10
  # Hybrid prediction: clips whose lights decide the call (foil/sabre On-No = L,
  # No-On = R; epee On-No = L, No-On = R, On-On = T) take the rule label; the
  # model decides On-On and foil On-Off/Off-On. Clips without hit_type use the
  # model. Metrics report the combined system and the model on ambiguous clips.
  hybrid_rules: true

# --- Augmentation ------------------------------------------------------------
augmentation:
  # Training augmentations
  train:
    # Small translate/scale jitter (fractions); identical for all frames of a clip
    random_affine:
      enabled: true
      translate: [0.05, 0.05]
      scale: [0.95, 1.05]
    gaussian_blur:
      enabled: false
      kernel_size: 3
      sigma: [0.1, 1.0]
    horizontal_flip:
      enabled: true
      prob: 0.5
    color_jitter:
      enabled: true
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.05
    random_grayscale:
      enabled: false
      prob: 0.1
    temporal_jitter:
      enabled: true
      # Max frames to shift the sampling start position
      max_shift: 2

  # Validation/test augmentations (deterministic)
  eval:
    center_crop: true

# --- Weights & Biases --------------------------------------------------------
wandb:
  enabled: true
  project: "fencing-ai"
  entity: "inter-glm"     # Team entity on Weights & Biases
  run_name: null          # null = auto-generated
  tags:
    - "foil"
    - "lora"
    - "videomae"
  # How often to log misclassified samples (in epochs)
  log_media_every_n_epochs: 2
  # Max misclassified samples to log per validation
  max_misclassified_samples: 24

# --- Hydra -------------------------------------------------------------------
hydra:
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
