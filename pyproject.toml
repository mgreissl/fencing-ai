[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fencing-ai"
version = "0.1.0"
description = "Automated computer vision system for referee decision prediction in Olympic fencing bouts"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Modern Fencing AI Contributors"}
]
license = {text = "MIT"}
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "wandb==0.30.0",
    "hydra-core==1.3.7",
    "omegaconf==2.3.1",
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "Pillow==12.3.0",
    "tqdm==4.70.1",
    "av==19.0.1",
    "peft==0.21.2",
    "opencv-python==5.0.0.93",
    "yt-dlp==2026.8.19",
    "decord==0.6.0",
    "ultralytics==8.4.175",
    "scipy==1.18.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.169.0",
]

[project.scripts]
fencing-ai = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
